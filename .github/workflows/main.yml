name: Build MDB APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip MDBStandaloneModMenu_Project.zip -d project

      - name: Set Java and Kotlin targets to 17
        run: |
          cat > force-java17.init.gradle <<'EOF'
          allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  sourceCompatibility = '17'
                  targetCompatibility = '17'
              }
              tasks.configureEach { task ->
                  if (task.hasProperty('kotlinOptions')) {
                      task.kotlinOptions.jvmTarget = '17'
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd project/MDBStandaloneModMenu
          gradle -I "$GITHUB_WORKSPACE/force-java17.init.gradle" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MDB-Mod-Menu-APK
          path: project/MDBStandaloneModMenu/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
