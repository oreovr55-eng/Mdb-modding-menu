name: Build MDB APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip MDBStandaloneModMenu_Project.zip -d project

      - name: Fix Kotlin source
        run: |
          cat > project/MDBStandaloneModMenu/app/src/main/java/com/mdb/standalone/MainActivity.kt <<'EOF'
          package com.mdb.standalone

          import android.app.Activity
          import android.os.Bundle
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {
              private lateinit var panel: LinearLayout
              private lateinit var hint: TextView
              private var menuOpen = true
              private val states = linkedMapOf("FLY" to false, "SPEED" to false, "GHOST" to false)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  buildMenu()
              }

              private fun buildMenu() {
                  val page = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(28, 20, 28, 20)
                      setBackgroundColor(0xFF090909.toInt())
                  }

                  val title = TextView(this).apply {
                      text = "MDB  •  MOD MENU"
                      textSize = 28f
                      setTextColor(0xFFFF3030.toInt())
                      gravity = Gravity.CENTER
                      setPadding(8, 8, 8, 8)
                  }
                  page.addView(title)

                  hint = TextView(this).apply {
                      text = "Standalone demo • Press controller X to hide/show"
                      textSize = 14f
                      setTextColor(0xFFDDDDDD.toInt())
                      gravity = Gravity.CENTER
                      setPadding(8, 4, 8, 18)
                  }
                  page.addView(hint)

                  panel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(16, 12, 16, 12)
                      setBackgroundColor(0xFF191919.toInt())
                  }

                  states.keys.forEach { feature ->
                      val button = Button(this)
                      button.text = "$feature: OFF"
                      button.textSize = 18f
                      button.setTextColor(0xFFFFFFFF.toInt())
                      button.setBackgroundTintList(
                          android.content.res.ColorStateList.valueOf(0xFFB51F2A.toInt())
                      )
                      button.setOnClickListener {
                          val enabled = !(states[feature] ?: false)
                          states[feature] = enabled
                          button.text = "$feature: ${if (enabled) "ON" else "OFF"}"
                          hint.text = "$feature changed • Demo toggle only"
                      }
                      panel.addView(button, LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { bottomMargin = 8 })
                  }

                  val close = Button(this).apply {
                      text = "CLOSE MENU"
                      setOnClickListener { setMenuVisible(false) }
                  }
                  panel.addView(close)

                  page.addView(panel, LinearLayout.LayoutParams(
                      520,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ))

                  val scroll = ScrollView(this)
                  scroll.addView(page)
                  setContentView(scroll)
              }

              private fun setMenuVisible(visible: Boolean) {
                  menuOpen = visible
                  panel.visibility = if (visible) View.VISIBLE else View.GONE
                  hint.text = if (visible) {
                      "Press controller X to hide/show"
                  } else {
                      "Menu hidden • Press controller X to reopen"
                  }
              }

              override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  if (event.action == KeyEvent.ACTION_DOWN &&
                      event.repeatCount == 0 &&
                      event.keyCode == KeyEvent.KEYCODE_BUTTON_X
                  ) {
                      setMenuVisible(!menuOpen)
                      return true
                  }
                  return super.dispatchKeyEvent(event)
              }
          }
          EOF

      - name: Set Java and Kotlin targets to 17
        run: |
          cat >> project/MDBStandaloneModMenu/app/build.gradle <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          EOF

      - name: Build APK
        run: |
          cd project/MDBStandaloneModMenu
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MDB-Mod-Menu-APK
          path: project/MDBStandaloneModMenu/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
